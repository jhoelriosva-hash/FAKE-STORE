<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Reporte de Productos (FakeStore API)</h1>
            <span class="badge bg-primary fs-6"
                  th:text="'Productos cargados: ' + ${totalRegistros}"></span>
        </div>
    </header>

    <main class="container mb-5">
        <section class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Detalle de Artículos Externos</h2>
                <button type="button" onclick="window.print()" class="btn btn-outline-secondary btn-sm">
                    Imprimir Reporte
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <caption>Listado de productos obtenidos desde https://fakestoreapi.com/products</caption>
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="text-center">ID</th>
                            <th scope="col" class="text-center">Imagen</th>
                            <th scope="col">Título y Descripción</th>
                            <th scope="col">Categoría</th>
                            <th scope="col" class="text-end">Precio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${productos}">
                            <td class="text-center fw-bold" th:text="${prod.id}"></td>
                            <td class="text-center">
                                <img th:src="${prod.image}"
                                     th:alt="'Fotografía de ' + ${prod.title}"
                                     style="width: 55px; height: 55px; object-fit: contain;">
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${prod.title}"></div>
                                <small class="text-muted d-block" style="max-width: 450px;"
                                       th:text="${prod.description}"></small>
                            </td>
                            <td>
                                <span class="badge bg-secondary text-uppercase"
                                      th:text="${prod.category}"></span>
                            </td>
                            <td class="text-end fw-bold"
                                th:text="'$ ' + ${#numbers.formatDecimal(prod.price, 1, 2)}"></td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="4" class="text-end fw-bold">Suma Total del Catálogo:</td>
                            <td class="text-end fw-bold text-success fs-5"
                                th:text="'$ ' + ${#numbers.formatDecimal(totalPrecios, 1, 2)}"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
